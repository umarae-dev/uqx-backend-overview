name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-backend-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Public repository guard
        run: python scripts/check_public_repo.py
      - name: Compile public Python
        run: python -m compileall -q production-safe tests scripts
      - name: Production-safe tests
        run: pytest -q
